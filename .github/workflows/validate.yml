name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s skills/qifu-list-page/tests -v
      - run: python skills/qifu-list-page/scripts/validate_skill_contract.py
      - run: python skills/qifu-drawer-form/scripts/validate_portable_manifest.py
      - run: python skills/qifu-drawer-form/scripts/validate_multi_platform_contract.py
      - run: python -m unittest discover -s skills/qifu-drawer-form/tests -v
      - run: bash -n sync.sh
      - run: bash scripts/test_sync.sh
      - run: python scripts/test_drawer_release_sync.py
