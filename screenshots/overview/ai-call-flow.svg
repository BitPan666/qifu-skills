 <g fill="#132233" font-size="23" font-weight="700" text-anchor="middle"><text x="220" y="315">解析 PageSpec</text><text x="560" y="315">选择 Archetype</text><text x="900" y="315">发现组件</text><text x="1290" y="315">应用 Adapter + 审计</text></g>
 <g fill="#64748b" font-size="15" text-anchor="middle"><text x="220" y="350">平台 / 对象 / 任务</text><text x="220" y="374">状态 / 权限 / 密度</text><text x="560" y="350">List / Detail / Form</text><text x="560" y="374">Dashboard / Wizard</text><text x="900" y="350">语义 → 组件集</text><text x="900" y="374">节点 ID / 发布 Key</text><text x="1290" y="350">导航 / 品牌 / 术语</text><text x="1290" y="374">层级 / 缺口 / 迁移性</text></g>
 <path d="M350 315H430M690 315H770M1030 315H1110" stroke="#3ecf8e" stroke-width="5"/>
 <rect x="165" y="535" width="1270" height="205" rx="22" fill="#132233"/>
 <text x="800" y="585" text-anchor="middle" fill="#a6ff4d" font-size="18" font-weight="700">Component Contract</text>
 <g fill="#fff" font-size="20" text-anchor="middle"><text x="320" y="635">semanticName</text><text x="570" y="635">componentSet</text><text x="820" y="635">nodeId / publishedKey</text><text x="1110" y="635">properties / states</text></g>
 <g fill="#9fb1c2" font-size="15" text-anchor="middle"><text x="320" y="674">按语义发现</text><text x="570" y="674">精确组件集</text><text x="820" y="674">跨文件可调用</text><text x="1110" y="674">约束与可用变体</text></g>
 <text x="800" y="805" text-anchor="middle" fill="#64748b" font-size="17">找不到组件时：合法组合 → Fallback / Capability → Audit / Missing Components</text>
