<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f6f8fb"/>
<text x="90" y="92" font-family="Arial,'PingFang SC',sans-serif" font-size="42" font-weight="700" fill="#132233">AI 组件调用流程</text>
<text x="92" y="132" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#64748b">先抽象，再发现，再实例化，最后审计</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <g fill="#fff" stroke="#d8e1ea" stroke-width="2">
  <rect x="90" y="230" width="260" height="170" rx="18"/><rect x="430" y="230" width="260" height="170" rx="18"/><rect x="770" y="230" width="260" height="170" rx="18"/><rect x="1110" y="230" width="360" height="170" rx="18"/>
 </g>
